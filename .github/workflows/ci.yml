name: macOS checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native application
        run: ./script/swift.sh build --configuration release
      - name: Existing workspace checks
        run: ./script/test.sh 2>&1 | tee .build/core-checks.log
      - name: Jupyter and Notebook integration checks
        run: |
          python3 -m venv .build/jupyter-test-venv
          .build/jupyter-test-venv/bin/python -m pip install -r Tests/requirements-jupyter.txt
          .build/jupyter-test-venv/bin/python script/run_jupyter_tests.py 2>&1 | tee .build/jupyter-checks.log
      - name: AI review checks with isolated localhost API
        run: ./script/test_ai.sh 2>&1 | tee .build/ai-checks.log
      - name: Check release metadata
        run: python3 script/package_release.py --check-version
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-test-evidence-${{ github.sha }}
          path: |
            .build/core-checks.log
            .build/ai-checks.log
            .build/jupyter-checks.log
          retention-days: 14
